name: Pixel cards
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:         # lets you run it manually
  push:
    branches: [main]
    paths: ["cards/**", "assets/**", ".github/workflows/pixel-cards.yml"]
permissions:
  contents: write            # so the action can commit the SVGs
concurrency: pixel-cards
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build cards
        env:
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || github.token }}
        run: node cards/build.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || git commit -m "Update pixel cards [skip ci]"
          git pull --rebase
          git push
