name: Pixel cards
on:
  schedule:
    - cron: "30 0 * * *"     # daily, 30 min after the metrics job
  workflow_dispatch:         # lets you run it manually
  push:
    branches: [main]
    paths: ["cards/**", ".github/workflows/pixel-cards.yml"]
permissions:
  contents: write            # so the action can commit the SVGs
concurrency: pixel-cards
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build cards
        env:
          # A token that can read your private repos (classic PAT with "repo" scope).
          # Falls back to the built-in token, which only sees public repos.
          GH_TOKEN: ${{ secrets.PIXEL_CARDS_TOKEN || github.token }}
        run: node cards/build.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "Update pixel cards [skip ci]"
          git pull --rebase
          git push
